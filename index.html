<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1017">
  <title>CRAB AI</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="glow"></div>
      <img class="crab" src="crab-avatar.jpg" alt="CRAB">
      <div class="eyebrow">CRAB AI</div>
      <h1>Центр управления</h1>
      <p id="modeText">Безопасный интерфейс Telegram</p>
    </section>
    <section class="grid" aria-label="Действия">
      <button data-action="status">📊 <span>Статус</span></button>
      <button data-action="task">📝 <span>Дать задачу</span></button>
      <button data-action="results">📋 <span>Результаты</span></button>
      <button data-action="ai">🧠 <span>ИИ и резерв</span></button>
      <button data-action="pause">⏸ <span>Пауза</span></button>
      <button data-action="manage">🛠 <span>Управление</span></button>
    </section>
    <section class="status">
      <span class="dot"></span>
      <span id="statusText">Готов к подключению</span>
    </section>
    <p class="foot">Mini App не выполняет действия сам: команды передаются боту и проходят его проверки.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
